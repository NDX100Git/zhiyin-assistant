name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_mysql_password
          MYSQL_DATABASE: zhiyin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_mysql_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: zhiyin
      DB_USER: root
      DB_PASSWORD: ci_mysql_password
      DB_POOL_SIZE: "10"
      DB_MAX_OVERFLOW: "10"
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: ci_minio_access
      MINIO_SECRET_KEY: ci_minio_secret
      MINIO_BUCKET: zhiyin-files
      MINIO_SECURE: "false"
      AUTO_CREATE_TABLES: "true"
      CLEANUP_ENABLED: "false"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci_admin_password
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long
      AWS_DEFAULT_REGION: us-east-1
      SOFFICE_PATH: /usr/bin/soffice
      SOFFICE_CONTAINER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            libreoffice-impress \
            fonts-noto-cjk

      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt "moto[server]==5.2.4"

      - name: Lint
        working-directory: backend
        run: ruff check . --output-format=github

      - name: Test
        working-directory: backend
        run: |
          moto_server -H 127.0.0.1 -p 9000 > "${RUNNER_TEMP}/moto-s3.log" 2>&1 &
          moto_pid=$!
          trap 'kill "$moto_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/moto-api/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "${RUNNER_TEMP}/moto-s3.log"
              exit 1
            fi
            sleep 1
          done
          pytest -q

  teacher-web:
    name: Teacher web build / lint / test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teacher-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: teacher-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  student-app:
    name: Student app build / lint / test (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - h5
          - mp-weixin
    defaults:
      run:
        working-directory: student-app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # lint 与单测只跟源码有关，不必在两个构建矩阵里各跑一遍
      - name: Lint
        if: matrix.target == 'h5'
        run: npm run lint

      - name: Test
        if: matrix.target == 'h5'
        run: npm test

      - name: Build
        run: npm run build:${{ matrix.target }}

  browser-e2e:
    name: Browser regression (e2e/run.mjs --start)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # 与 backend/.env.example 同口径；容器端口固定 3306 / 9000，
      # 与本地开发一致，run.mjs --start 自己起后端、学生端、老师端
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_mysql_password
          MYSQL_DATABASE: zhiyin_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_mysql_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # run.mjs --start 会用 DB_NAME=zhiyin_e2e 重建库、用独立桶，这里给出连接参数
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: zhiyin_e2e
      DB_USER: root
      DB_PASSWORD: ci_mysql_password
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: ci_minio_access
      MINIO_SECRET_KEY: ci_minio_secret
      MINIO_BUCKET: zhiyin-files-e2e
      MINIO_SECURE: "false"
      AWS_DEFAULT_REGION: us-east-1
      # 回归环境没有真实密钥，老师端登录口令由 e2e 自己读这里
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: ci_admin_password
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci_admin_password
      JWT_SECRET: ci_jwt_secret_at_least_32_characters_long
      # 回归不跑 LibreOffice 转格式：Office 文档那条链路由后端单测覆盖
      SOFFICE_PATH: ""
      SOFFICE_CONTAINER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            student-app/package-lock.json
            teacher-web/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix student-app
          npm ci --prefix teacher-web
          npm ci --prefix e2e

      # run.mjs 自己 spawn 后端、学生端、老师端，只需要一个 Chrome
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run browser regression
        working-directory: e2e
        env:
          E2E_PYTHON: python
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          # e2e 只需要兼容 S3 的对象存储。用已随测试依赖安装的 moto，
          # 避免再拉第三方容器；MySQL service 由 Actions 等健康后再执行本步骤。
          moto_server -H 127.0.0.1 -p 9000 > "${RUNNER_TEMP}/moto-s3-e2e.log" 2>&1 &
          moto_pid=$!
          trap 'kill "$moto_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/moto-api/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "${RUNNER_TEMP}/moto-s3-e2e.log"
              exit 1
            fi
            sleep 1
          done
          node run.mjs --start

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: e2e/artifacts/**
          if-no-files-found: warn
          retention-days: 14
